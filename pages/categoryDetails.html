<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetstol - Категорії</title>
    <link rel="stylesheet" href="../styles/css/style.css">
    <link rel="stylesheet" href="../styles/css/categories.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <nav class="nav-wrapper">
                <a href="../index.html" class="nav-logo">
                    <img src="../assets/logo/vetstol_logo.png" alt="Vetstol Logo">
                </a>
                <div class="nav-menu">
                    <a href="../index.html#categories" class="nav-link">Категорії</a>
                    <a href="../index.html#about" class="nav-link">Про нас</a>
                    <a href="../index.html#advantages" class="nav-link">Переваги</a>
                    <a href="../index.html#contact" class="nav-link">Контакти</a>
                </div>
                <button class="mobile-menu-toggle" aria-label="Відкрити меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </nav>
        </div>
    </header>

    <div class="breadcrumbs">
        <div class="container">
            <a href="../index.html">Головна</a>
            <span class="separator">›</span>
            <a href="../index.html#categories">Категорії</a>
            <span class="separator">›</span>
            <span id="currentCategory" class="current-page">Деталі категорії</span>
        </div>
    </div>

    <main class="category-page">
        <div class="container">
            <!-- Category Header -->
            <section class="category-header">
                <div class="category-info">
                    <img id="categoryIcon" src="" alt="Category Icon" class="category-icon">
                    <div class="category-text">
                        <h1 id="categoryName">Назва категорії</h1>
                        <p id="categoryDescription">Опис категорії</p>
                    </div>
                </div>
            </section>

            <!-- Products Grid -->
            <section class="products-section">
                <div class="products-grid" id="productsGrid">
                    <!-- Products will be dynamically inserted here -->
                </div>
            </section>
        </div>
    </main>

    <script type="module">
        import dataStore from '../js/models/dataStore.js';
        import { createProductCard } from '../js/components/productCard.js';

        // Get category slug from URL parameters
        const params = new URLSearchParams(window.location.search);
        const categorySlug = params.get('category');

        // Get category and its products
        const category = dataStore.getCategory(categorySlug);
        if (category) {
            // Update page title
            document.title = `Vetstol - ${category.name}`;
            
            // Update breadcrumb
            document.getElementById('currentCategory').textContent = category.name;
            
            // Update category header
            document.getElementById('categoryName').textContent = category.name;
            document.getElementById('categoryDescription').textContent = category.description;
            document.getElementById('categoryIcon').src = category.iconPath;
            
            // Get products for this category
            const products = dataStore.getProductsByCategory(categorySlug);
            
            // Generate product cards
            const productsGrid = document.getElementById('productsGrid');
            if (products && products.length > 0) {
                products.forEach(product => {
                    const productCard = createProductCard(product);
                    productsGrid.appendChild(productCard);
                });
            } else {
                productsGrid.innerHTML = '<div class="no-products">У цій категорії поки немає товарів</div>';
            }
        } else {
            // Handle category not found
            window.location.href = '../index.html#categories';
        }
    </script>
</body>
</html>
